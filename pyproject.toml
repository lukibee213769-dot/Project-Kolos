[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kolos"
version = "1.0.1"
description = "Kolos programming language, compiler, interpreters, and command-line tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kolos Contributors" }]
keywords = ["language", "runtime", "vm", "bytecode", "interpreter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "flake8", "build>=1.2.2"]

[project.scripts]
kolos = "kolos.cli:main"

[project.urls]
Repository = "https://github.com/lukibee213769-dot/Project-Kolos"
Issues = "https://github.com/lukibee213769-dot/Project-Kolos/issues"
Documentation = "https://github.com/lukibee213769-dot/Project-Kolos/tree/main/docs"

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503"]

[tool.setuptools.packages.find]
include = ["kolos*", "runtime*", "compilers*", "tools*"]

[tool.setuptools.package-data]
"runtime.bytecode" = ["sample.asm"]
