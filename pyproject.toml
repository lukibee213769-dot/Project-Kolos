[tool.poetry]
name = "kolos"
version = "0.0.1"
description = "Kolos prototype: runtime + kernel prototype"
authors = ["Kolos <dev@example.com>"]
packages = [
	{ include = "kolos" },
	{ include = "runtime" },
]

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
kolos = "kolos.cli:main"
