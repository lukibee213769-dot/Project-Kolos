name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt build

      - name: Run bootstrap
        run: python bootstrap.py

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Lint Python correctness
        run: python -m flake8 . --select=F

      - name: Build package
        run: python -m build

      - name: Smoke-test installed CLI
        run: |
          python -m pip install .
          axiom run-sample

  rust-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust formatting
        run: cd kernel && cargo fmt --all -- --check
      - name: Build Rust kernel
        run: |
          cd kernel && cargo build --verbose
      - name: Test Rust kernel
        run: |
          cd kernel && cargo test --verbose

  bootable-os-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU and OVMF firmware
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 300s sudo apt-get update
          timeout 300s sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Install nightly Rust and kernel targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: llvm-tools-preview,rust-src
      - name: Test AXIOM OS runner
        timeout-minutes: 25
        run: cargo test --locked --release
        working-directory: kernel/os
      - name: Build AXIOM OS kernel, UEFI image, and runner
        timeout-minutes: 25
        run: cargo build --locked --release
        working-directory: kernel/os
      - name: Stage bootable UEFI image
        run: |
          set -euo pipefail
          image=$(find target/release/build -path '*/out/axiom-uefi.img' -type f -print -quit)
          if [ -z "$image" ]; then
            echo "::error::Bootable UEFI image was not generated"
            exit 1
          fi
          cp "$image" "$RUNNER_TEMP/axiom-os-uefi.img"
          sha256sum "$RUNNER_TEMP/axiom-os-uefi.img" > "$RUNNER_TEMP/axiom-os-uefi.img.sha256"
        working-directory: kernel/os
      - name: Upload bootable UEFI image
        uses: actions/upload-artifact@v4
        with:
          name: axiom-os-uefi-image
          path: |
            ${{ runner.temp }}/axiom-os-uefi.img
            ${{ runner.temp }}/axiom-os-uefi.img.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Boot AXIOM OS in QEMU
        timeout-minutes: 5
        run: |
          set +e
          cargo run --locked --release 2>&1 | tee "$RUNNER_TEMP/axiom-qemu.log"
          result=${PIPESTATUS[0]}
          echo "QEMU exit code: $result"
          if [ "$result" -ne 0 ]; then
            excerpt=$(tail -n 30 "$RUNNER_TEMP/axiom-qemu.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=AXIOM OS QEMU boot::$excerpt"
            {
              echo '## AXIOM OS QEMU Boot Failure'
              echo "Exit code: $result"
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/axiom-qemu.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
        working-directory: kernel/os
