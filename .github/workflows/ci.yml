name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt build

      - name: Run bootstrap
        run: python bootstrap.py

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Lint Python correctness
        run: python -m flake8 . --select=F

      - name: Build package
        run: python -m build

      - name: Smoke-test installed CLI
        run: |
          python -m pip install .
          kolos run-sample

  rust-kernel-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust formatting
        run: cd kernel && cargo fmt --all -- --check
      - name: Build Rust kernel
        run: |
          cd kernel && cargo build --verbose
      - name: Test Rust kernel
        run: |
          cd kernel && cargo test --verbose

