name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt build

      - name: Run bootstrap
        run: python bootstrap.py

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Lint Python correctness
        run: python -m flake8 . --select=F

      - name: Build package
        run: python -m build

      - name: Smoke-test installed CLI
        run: |
          python -m pip install .
          kolos run-sample

  rust-kernel-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust formatting
        run: cd kernel && cargo fmt --all -- --check
      - name: Build Rust kernel
        run: |
          cd kernel && cargo build --verbose
      - name: Test Rust kernel
        run: |
          cd kernel && cargo test --verbose

  bootable-os-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 180s sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Install nightly Rust and kernel targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: llvm-tools-preview
      - name: Build and boot Kolos OS in QEMU
        timeout-minutes: 10
        run: |
          set +e
          cargo run -- uefi 2>&1 | tee "$RUNNER_TEMP/kolos-qemu.log"
          result=${PIPESTATUS[0]}
          echo "QEMU exit code: $result"
          if [ "$result" -ne 0 ]; then
            excerpt=$(tail -n 30 "$RUNNER_TEMP/kolos-qemu.log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Kolos OS QEMU build failed::$excerpt"
            {
              echo '## Kolos OS QEMU failure'
              echo "Exit code: $result"
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/kolos-qemu.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
        working-directory: kernel/os
