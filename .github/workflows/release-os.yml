name: Release AXIOM OS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'os-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download bootable image
        uses: actions/download-artifact@v4
        with:
          name: axiom-os-uefi-image
          path: release-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#os-v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [AXIOM OS ${version}]" '
            index($0, heading) == 1 { printing = 1 }
            printing && /^## / && index($0, heading) != 1 { exit }
            printing { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::No matching AXIOM OS release notes found in CHANGELOG.md"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/axiom-os-uefi.img \
            release-assets/axiom-os-uefi.img.sha256 \
            --title "AXIOM OS v${version}" \
            --notes-file "$notes_file" \
            --verify-tag
